
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:white;font-family:Arial,sans-serif}
header{height:58px;display:flex;align-items:center;gap:15px;padding:0 14px;background:#0f0f0f;position:sticky;top:0;z-index:5}
button{border:0;background:transparent;color:white;font-size:20px;cursor:pointer}
#search{flex:1;min-width:0;display:flex;gap:5px}
#search input{width:100%;min-width:0;background:#222;color:white;border:1px solid #444;border-radius:25px;padding:11px 16px;font-size:15px}
#search button{background:#292929;border-radius:50%;width:42px}
#videos{padding:8px;display:grid;grid-template-columns:1fr;gap:18px}
.video{cursor:pointer}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#222}
.details{display:flex;gap:12px;padding:9px 3px}
.channel{width:38px;height:38px;border-radius:50%;background:#333;flex-shrink:0}
.info{flex:1;min-width:0}
.info strong{font-size:15px;line-height:1.4;display:block}
.info small{display:block;color:#aaa;margin-top:5px;font-size:12px}
.more{font-size:21px;padding:0 8px}
#drawer{position:fixed;inset:0;background:#0009;z-index:10;display:none}
#menu{width:270px;height:100%;background:#181818;padding:20px}
.menuitem{display:block;width:100%;text-align:left;padding:16px;border-radius:9px;font-size:16px}
.menuitem:active{background:#333}
#player{display:none;position:fixed;inset:0;background:#0f0f0f;z-index:8;overflow:auto}
#player iframe{width:100%;aspect-ratio:16/9;border:0}
#player h3{padding:10px 15px}
#player button{padding:12px}
#status{text-align:center;color:#aaa;padding:25px}
@media(min-width:700px){
#videos{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header>
<button onclick="openMenu()">☰</button>
<div id="search">
<input id="query" placeholder="Search" onkeydown="if(event.key==='Enter')searchVideos()">
<button onclick="searchVideos()">⌕</button>
</div>
</header>

<div id="videos"></div>
<div id="status">Loading videos...</div>

<div id="drawer" onclick="closeMenu()">
<div id="menu" onclick="event.stopPropagation()">
<button onclick="closeMenu()" style="margin-bottom:20px">✕</button>
<button class="menuitem" onclick="home()">⌂ Home</button>
<button class="menuitem" onclick="showMessage('Music Library')">♫ Music</button>
<button class="menuitem" onclick="home()">▣ Videos</button>
<button class="menuitem" onclick="showMessage('Select audio files from your phone to play them.')">↓ Downloads</button>
<button class="menuitem" onclick="showMessage('Voice search will be available in a supported browser.')">🎙 Voice Search</button>
</div>
</div>

<div id="player">
<button onclick="closePlayer()">← Back</button>
<div id="frame"></div>
<h3 id="videoTitle"></h3>
</div>

<script>
const API_KEY =  'AIzaSyBEF30dvGNnpyVWgbFCpuqaVO0h_4r6VxU';

const videos = document.getElementById('videos');
const statusBox = document.getElementById('status');

function openMenu(){
 document.getElementById('drawer').style.display='block';
}
function closeMenu(){
 document.getElementById('drawer').style.display='none';
}
function showMessage(message){
 closeMenu();
 alert(message);
}
function home(){
 closeMenu();
 loadTrending();
}
function showStatus(message){
 statusBox.textContent=message;
 statusBox.style.display='block';
}

async function loadTrending(){
 videos.innerHTML='';
 showStatus('Loading videos...');
 if(API_KEY.includes('PASTE_YOUR')){
  showStatus('Add your YouTube API key to load videos.');
  return;
 }
 try{
  const url='https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=IN&videoCategoryId=10&maxResults=30&key='+API_KEY;
  const response=await fetch(url);
  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||'YouTube API error');
  displayVideos(data.items||[]);
 }catch(error){
  console.error("YouTube API Error:", error);
  showStatus("Error: " + error.message);
 }
}

async function searchVideos(){
 const q=document.getElementById('query').value.trim();
 if(!q)return;
 videos.innerHTML='';
 showStatus('Searching...');
 try{
  const url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&regionCode=IN&order=relevance&maxResults=25&q='+encodeURIComponent(q)+'&key='+API_KEY;
  const response=await fetch(url);
  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||'Search error');
  const items=(data.items||[]).filter(v=>v.id.videoId).map(v=>({
   id:v.id.videoId,
   snippet:v.snippet
  }));
  displayVideos(items);
 }catch(error){
  console.error("YouTube Search Error:", error);
  showStatus("Search Error: " + error.message);
 }
}

function displayVideos(items){
 videos.innerHTML='';
 if(!items.length){
  showStatus('No videos found.');
  return;
 }
 statusBox.style.display='none';
 items.forEach(item=>{
  const id=typeof item.id==='string'?item.id:item.id.videoId;
  const s=item.snippet;
  const thumb=s.thumbnails?.high?.url||s.thumbnails?.medium?.url||s.thumbnails?.default?.url;
  const card=document.createElement('div');
  card.className='video';
  const img=document.createElement('img');
  img.className='thumb';
  img.src=thumb||'';
  img.alt='';
  const details=document.createElement('div');
  details.className='details';
  const avatar=document.createElement('div');
  avatar.className='channel';
  const info=document.createElement('div');
  info.className='info';
  const title=document.createElement('strong');
  title.textContent=s.title;
  const channel=document.createElement('small');
  channel.textContent=s.channelTitle||'';
  info.append(title,channel);
  const more=document.createElement('button');
  more.className='more';
  more.textContent='⋮';
  more.onclick=e=>{
   e.stopPropagation();
   alert('Download is available only for videos whose owner provides an authorized download option.');
  };
  details.append(avatar,info,more);
  card.append(img,details);
  card.onclick=()=>playVideo(id,s.title);
  videos.append(card);
 });
}

function playVideo(id,title){
 document.getElementById('player').style.display='block';
 document.getElementById('videoTitle').textContent=title;
 document.getElementById('frame').innerHTML=
 '<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
}
function closePlayer(){
 document.getElementById('player').style.display='none';
 document.getElementById('frame').innerHTML='';
}
loadTrending();
</script>
</body>
</html>
