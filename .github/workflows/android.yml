
name: Video Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: "3.11"
          buildozer-cmd: buildozer -v android debug
          workdir: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-APK
          path: bin/*.apk

